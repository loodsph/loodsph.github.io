<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  {%- seo -%}

  {%- if page.pixel_icon -%}
  <meta property="og:image" content="{{ site.url }}/assets/pixel_art/{{ page.pixel_icon }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/pixel_art/{{ page.pixel_icon }}">
  <meta name="twitter:card" content="summary">
  {%- elsif page.layout == 'home' or page.url == '/' -%}
  <meta property="og:image" content="{{ site.url }}/assets/escher.webp">
  <meta name="twitter:image" content="{{ site.url }}/assets/escher.webp">
  <meta name="twitter:card" content="summary_large_image">
  {%- endif -%}

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {%- feed_meta -%}

  <!-- MathJax for LaTeX rendering -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
          integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei"
          crossorigin="anonymous" async></script>
</head>
